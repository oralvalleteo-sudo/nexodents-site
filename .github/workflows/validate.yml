name: Verificar privacidade e cadastro do site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV,'CHROMIUM_BIN='+require('playwright').chromium.executablePath()+'\n')"
      - run: npm test
